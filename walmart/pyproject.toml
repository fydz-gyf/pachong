[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-http-scraper"
version = "0.9.0"
description = "Modular Walmart HTTP product search scraper"
requires-python = ">=3.10"
dependencies = [
  "curl_cffi>=0.13.0",
  "requests>=2.32.0",
  "websocket-client>=1.8.0",
  "openpyxl>=3.1.5",
  "Pillow>=11.0.0",
]

[project.scripts]
walmart-scraper = "walmart_scraper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
